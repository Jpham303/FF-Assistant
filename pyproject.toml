[project]
name = "ffa"
version = "0.1.0"
description = "Fantasy football assistant: backtested projections, matchup-aware start/sit, and trade analysis behind a FastAPI + MCP interface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "duckdb>=1.1",
    "polars>=1.6",
    "pyarrow>=17",
    "sqlalchemy>=2.0,<2.1",  # 2.1 defaults Postgres to psycopg 3, which Dagster 1.13 storage breaks on
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "statsmodels>=0.15.0",
    "scipy>=1.18.1",
    "numpy>=2.5.4",
    "mcp>=1.10",
    "dagster-postgres>=0.29.25",
]

[project.scripts]
ffa = "ffa.cli:main"
ffa-mcp = "ffa.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffa", "dagster_defs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.dagster]
module_name = "dagster_defs"
