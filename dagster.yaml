# Dagster instance config: run history and schedules stored in the same Postgres.
storage:
  postgres:
    postgres_db:
      hostname: postgres
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      db_name:
        env: POSTGRES_DB
      port: 5432

# At most two runs at once, so a backfill can't exhaust Docker's memory.
run_queue:
  max_concurrent_runs: 2
