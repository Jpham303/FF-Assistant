services:
  postgres:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    command: uvicorn ffa.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: [./data:/data]
    depends_on:
      postgres: { condition: service_healthy }

  dagster-webserver:
    build: .
    env_file: .env
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w workspace.yaml
    ports: ["3000:3000"]
    volumes: [./data:/data]
    depends_on:
      postgres: { condition: service_healthy }

  dagster-daemon:
    build: .
    env_file: .env
    command: dagster-daemon run -w workspace.yaml
    volumes: [./data:/data]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
