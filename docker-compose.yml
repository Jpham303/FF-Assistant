# Fixed project name: volumes keep the same names wherever the folder is (or links to).
name: ff-assistant

x-app: &app
  build:
    context: .
    args:
      GIT_SHA: ${FFA_GIT_SHA:-unknown}  # set FFA_GIT_SHA before building to record it
  env_file: .env
  # Thread caps: uncapped, Polars and the linear-algebra libraries each start a thread per
  # core (32 here) inside the simulation loops and fight over the CPUs. Measured Oct 26:
  # rest-of-season 72 s a week uncapped, 8 s capped.
  environment:
    POLARS_MAX_THREADS: "4"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
  # Data lives in a Docker volume (Linux storage): reading thousands of Parquet files
  # from a Windows-drive bind mount took ~90 s per warehouse open (Oct 24). Reports stay
  # on the host so they open in Windows. One-time move: scripts/move-data-to-volume.ps1.
  volumes:
    - ffa-data:/data
    - ./data/reports:/data/reports
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16
    env_file: .env
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # Applies database migrations, then exits. Everything else waits for it.
  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: uvicorn ffa.api.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]

  dagster-webserver:
    <<: *app
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w workspace.yaml
    ports: ["127.0.0.1:${DAGSTER_PORT:-3300}:3000"]

  dagster-daemon:
    <<: *app
    command: dagster-daemon run -w workspace.yaml

volumes:
  pgdata:
  ffa-data:
