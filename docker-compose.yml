x-app: &app
  build: .
  env_file: .env
  volumes: [./data:/data]
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # Applies database migrations, then exits. Everything else waits for it.
  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: uvicorn ffa.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]

  dagster-webserver:
    <<: *app
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w workspace.yaml
    ports: ["3000:3000"]

  dagster-daemon:
    <<: *app
    command: dagster-daemon run -w workspace.yaml

volumes:
  pgdata:
